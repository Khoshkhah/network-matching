<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="tNetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="tNetB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="tDtwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <filter id="tSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="conflation-mark" transform="translate(5, 5)">
    <!-- DTW CORRESPONDENCE BRIDGES -->
    <g id="dtw-bridges" stroke="url(#tDtwGold)" stroke-width="3" stroke-dasharray="5 5" opacity="0.9" filter="url(#tSoftGlow)">
      <line x1="120" y1="110" x2="160" y2="155"/>
      <line x1="165" y1="195" x2="215" y2="230"/>
      <line x1="225" y1="100" x2="280" y2="145"/>
      <line x1="280" y1="260" x2="320" y2="305"/>
      <line x1="335" y1="145" x2="365" y2="200"/>
    </g>

    <!-- NETWORK A (Source Highway Curve - Cyan) -->
    <g id="net-a">
      <path d="M 80 140 C 130 80, 185 80, 225 100 C 280 130, 295 230, 350 265 C 380 285, 405 275, 420 255" 
            fill="none" stroke="url(#tNetA)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#tSoftGlow)"/>
      <path d="M 80 140 L 120 210 L 165 195" 
            fill="none" stroke="url(#tNetA)" stroke-width="5" stroke-linecap="round"/>

      <!-- Direction Arrowheads A -->
      <polygon points="190,88 206,94 194,106" fill="#00F2FE"/>
      <polygon points="330,252 346,262 332,272" fill="#00F2FE"/>

      <!-- Nodes A -->
      <circle cx="80" cy="140" r="7.5" fill="#FFF" filter="url(#tSoftGlow)"/>
      <circle cx="120" cy="110" r="6.5" fill="#00F2FE"/>
      <circle cx="165" cy="195" r="6.5" fill="#00F2FE"/>
      <circle cx="225" cy="100" r="9" fill="#FFF" filter="url(#tSoftGlow)"/>
      <circle cx="335" cy="145" r="6.5" fill="#00F2FE"/>
      <circle cx="350" cy="265" r="8" fill="#00F2FE" filter="url(#tSoftGlow)"/>
      <circle cx="420" cy="255" r="6.5" fill="#00F2FE"/>
    </g>

    <!-- NETWORK B (Target Highway Curve - Magenta) -->
    <g id="net-b">
      <path d="M 110 200 C 150 140, 210 150, 255 165 C 305 185, 315 275, 375 300 C 405 310, 425 295, 435 275" 
            fill="none" stroke="url(#tNetB)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#tSoftGlow)"/>
      <path d="M 255 165 L 280 240 L 320 285" 
            fill="none" stroke="url(#tNetB)" stroke-width="5" stroke-linecap="round"/>

      <!-- Direction Arrowheads B -->
      <polygon points="230,158 246,162 234,174" fill="#EC4899"/>
      <polygon points="350,290 366,296 352,306" fill="#EC4899"/>

      <!-- Nodes B -->
      <circle cx="110" cy="200" r="6.5" fill="#EC4899"/>
      <circle cx="160" cy="155" r="7.5" fill="#FFF" filter="url(#tSoftGlow)"/>
      <circle cx="215" cy="230" r="6.5" fill="#EC4899"/>
      <circle cx="255" cy="165" r="9" fill="#FFF" filter="url(#tSoftGlow)"/>
      <circle cx="280" cy="145" r="6.5" fill="#EC4899"/>
      <circle cx="280" cy="240" r="6.5" fill="#EC4899"/>
      <circle cx="320" cy="285" r="6.5" fill="#EC4899"/>
      <circle cx="365" cy="200" r="6.5" fill="#EC4899"/>
      <circle cx="375" cy="300" r="8" fill="#EC4899" filter="url(#tSoftGlow)"/>
      <circle cx="435" cy="275" r="6.5" fill="#EC4899"/>
    </g>

    <!-- Golden Alignment Core -->
    <circle cx="240" cy="132" r="20" fill="#FFD166" opacity="0.2" filter="url(#tSoftGlow)"/>
    <circle cx="240" cy="132" r="10" fill="#FFF" stroke="#FFB300" stroke-width="3.5" filter="url(#tSoftGlow)"/>
  </g>
</svg>
