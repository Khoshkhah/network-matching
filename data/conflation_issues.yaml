# Conflation data-quality issues (OSM <-> Sweden NVDB) — manually curated.
# Format spec & field docs: docs/conflation_issues.schema.yaml
# Add one entry per issue under `issues:`.

schema_version: 2
area: sundbyberg
sources:
  osm:  { name: "OpenStreetMap", id_fields: [edge_id, osm_id] }
  nvdb: { name: "Sweden NVDB",   id_fields: [directed_id, original_edge_id, nvdb_id] }

issues:

  - id: oneway_direction_conflict:osm=483898476:nvdb=1867484
    type: oneway_direction_conflict
    severity: warning
    summary: >-
      Both OSM and NVDB tag this road one-way but their geometries run opposite
      ways — the sources disagree on direction (likely actually two-way).
    road_name: Skogsbacken

    members:
      osm:
        edge_id: 1992
        osm_id: 483898476
        geometry: "LINESTRING (17.976752400000002 59.36492200000001, 17.9773989 59.36530930000001, 17.9775592 59.365396700000005)"
        raw:
          highway: residential
          name: Skogsbacken
          oneway: "yes"
          maxspeed: "30"
          lanes: null
          surface: asphalt
          sidewalk: both
          lit: "yes"
          source: "survey:Bing"
      nvdb:
        directed_id: 991
        original_edge_id: 1036
        nvdb_id: 1867484
        geometry: "LINESTRING (17.977583346343597 59.36539185645856, 17.977467212297146 59.36535249118147, 17.977374431618298 59.365310031315246, 17.97730073397438 59.36526536522443, 17.977183885747245 59.36517748279478, 17.976760991145035 59.36491902786754)"
        raw:
          name: Skogsbacken
          highway: unclassified
          oneway: "yes"
          maxspeed_kmh: 30
          lanes: null

    evidence:
      matched_len_m: 136.6
      overlap_ab_pct: 99
      overlap_ba_pct: 98
      dtw_m: 1.3
      anti_parallel: true

    review:
      status: confirmed
      suggestion:
        osm:  { oneway: "no" }
        nvdb: { oneway: "no" }
      note: >-
        Field knowledge: two-way residential street; both sources mis-tagged it
        as one-way. Push oneway=no to OSM and flag NVDB.
      reviewer: kaveh

