[build-system]
# one wheel with the Rust engine of graph-DTW in it: the module network_matching._rust (rust/network-matching-py, abi3)
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "network-matching"
version = "0.1.0"
description = "A general-purpose, reusable directed road map matching and conflation library using DuckDB and Python DTW."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "duckdb>=0.9.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "shapely>=2.0.0",
    "geopandas>=0.10.0",
    "networkx>=3.0",
    "joblib>=1.0.0"
]

[project.optional-dependencies]
viz = ["folium>=0.14.0", "branca>=0.6.0", "matplotlib>=3.5.0", "plotly>=5.0", "ipywidgets>=8.0"]
ml = ["scikit-learn>=1.0"]   # IsolationForest in suggest_thresholds (optional; guarded import)
dev = ["pytest", "ipykernel", "nbconvert", "scipy>=1.7.0", "scikit-learn>=1.0"]

[tool.maturin]
python-source = "."
python-packages = ["network_matching"]
module-name = "network_matching._rust"
manifest-path = "rust/network-matching-py/Cargo.toml"
profile = "release"    # a debug build of the engine is slow, also in pip install -e .
include = [{ path = "rust/**/*", format = "sdist" }]
exclude = [{ path = "rust/target/**", format = "sdist" }]
